name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach binaries to GitHub Releases on tag pushes

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check generated icons are up to date
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          python tools/gen_icons.py
          git diff --exit-code -- src/RetroCap/Theme/Icons.xaml

      - name: Publish (self-contained single file)
        run: dotnet publish src/RetroCap/RetroCap.csproj -c Release -r ${{ matrix.rid }} -o dist/${{ matrix.rid }}

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/${{ matrix.rid }}/RetroCap.exe -DestinationPath RetroCap-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RetroCap-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}/RetroCap.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RetroCap-${{ matrix.rid }}.zip
